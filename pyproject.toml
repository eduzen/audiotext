[build-system]
requires = ["uv_build>=0.13.9,<0.14.0"]
build-backend = "uv_build"

[project]
name = "audiotext"
version = "0.1.0"
description = "Local Whisper transcription bot for Telegram audio messages"
readme = "README.md"
requires-python = "==3.14.*"
dependencies = [
    "faster-whisper>=1.2.1",
    "python-telegram-bot>=22.8",
]

[project.scripts]
audiotext = "audiotext.bot:main"

[dependency-groups]
dev = [
    "ruff>=0.17.6",
    "ty>=0.0.107",
]

[tool.uv]
# faster-whisper 1.2.1 passes metadata_errors to av.open(), removed in PyAV 19.
constraint-dependencies = ["av<19"]

[tool.ruff.lint]
extend-select = ["UP"]

